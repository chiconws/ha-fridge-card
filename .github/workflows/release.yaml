name: Release

# Push a vX.Y.Z tag on main. This checks the tag against package.json, builds the
# card and opens a DRAFT release with the bundle attached. Review it and click Publish.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }

      - name: Build
        run: npm ci && npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.js --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
